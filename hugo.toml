baseURL = "https://hayato-global.github.io/"
languageCode = "en-us"
title = "Global Income Lab"
theme = "hugo-theme-stack"

[languages]
    [languages.en]
        languageCode = "en-us"
        languageName = "English"
        contentDir = "content/en"
        weight = 1
        [languages.en.menu]
            [[languages.en.menu.main]]
                identifier = "home"
                name = "Home"
                url = "/"
                weight = 1
                params = { icon = "home" }

    [languages.es]
        languageCode = "es-es"
        languageName = "Español"
        contentDir = "content/es"
        weight = 2
        [languages.es.menu]
            [[languages.es.menu.main]]
                identifier = "home"
                name = "Inicio"
                url = "/"
                weight = 1
                params = { icon = "home" }

    [languages.id]
        languageCode = "id-id"
        languageName = "Indonesya"
        contentDir = "content/id"
        weight = 3
        [languages.id.menu]
            [[languages.id.menu.main]]
                identifier = "home"
                name = "Beranda"
                url = "/"
                weight = 1
                params = { icon = "home" }

    [languages.pt]
        languageCode = "pt-br"
        languageName = "Português"
        contentDir = "content/pt"
        weight = 4
        [languages.pt.menu]
            [[languages.pt.menu.main]]
                identifier = "home"
                name = "Início"
                url = "/"
                weight = 1
                params = { icon = "home" }
            [[languages.pt.menu.main]]
                identifier = "privacy"
                name = "Privacidade"
                url = "/pt/privacy/"
                weight = 2
                params = { icon = "search" }

[params]
    mainSections = ["post"]
    featuredImageField = "image"
    googleSiteVerification = "NYlpAAtIIQCjJTYmWzerrd7FNBbhdyiNJdTAQG-9LxE" # GSC Verified! ✨

    [params.sidebar]
        avatar = "/img/avatar.png"
        bio = "Automating global income streams with AI."
        subtitle = "AI & Global Earnings"
        owner = "Hayato"

[services]
    [services.googleAnalytics]
        ID = ""
